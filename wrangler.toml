name = "prices"
main = "src/main.ts"
compatibility_date = "2024-12-01"

# KV namespace for caching token prices (create with: wrangler kv:namespace create PRICES_KV)
[[kv_namespaces]]
binding = "PRICES_KV"
id = "6daef1602200411199302b0a3411c42b"

# Run price fetch every 2 minutes
[triggers]
crons = ["*/2 * * * *"]
